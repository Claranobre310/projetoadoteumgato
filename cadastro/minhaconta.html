<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../Iconcreme-Halloween-Cat.ico" type="image/x-icon" />
    <link rel="stylesheet" href="estilo.css" />
    <title>Cadastro | AdoteUmGatoMoc</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../Iconcreme-Halloween-Cat.ico" alt="ícone da página" width="85px" />
            <span><strong>AdoteUmGatoMoc</strong></span>
        </div>
        <nav>
            <a href="../newindex.html"><strong>Início</strong></a>
            <a href="../gatosdispnew.html">Gatos</a>
            <a href="../gatosdefnew.html">Especiais</a>
            <a href="../doacoes/paginicidoacao.html">Doações</a>
            <a href="minhaconta.html" class="destaque"> Minha conta </a>
        </nav>
    </header>
    <hr />
    <main class="login-main">
        <section class="login-container">
            <h2>Login</h2>
            <p>Acesse sua conta para gerenciar adoções e atualizações.</p>

            <form id="formLogin" action="#" method="post" class="form-login">
                <div class="campo">
                    <label for="email-login">E-mail</label>
                    <input type="email" id="email-login" name="email" placeholder="seu@email.com" required />
                </div>


                <div class="campo">
                    <label for="senha-login">Senha</label>
                    <input type="password" id="senha-login" name="senha" placeholder="Digite sua senha" required />
                </div>

                <div class="campo-checkbox">
                    <input type="checkbox" id="lembrar" name="lembrar" />
                    <label for="lembrar">Lembrar-me</label>
                </div>

  
                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <p class="login-links">
                <a href="tela.html">Criar conta</a> | 
                <a href="#">Esqueci minha senha</a>
            </p>
        </section>
    </main>

    <hr />

    <footer>
        <p>🐾 AdoteUmGatoMoc – Montes Claros – MG</p>
        <p>❤️ Transforme uma vida, adote um gatinho!</p>
    </footer>

    <!--script js p validar, dps passa p um dashboard e volta pro index -->
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email-login').value.trim();
            const senha = document.getElementById('senha-login').value.trim();

            if (email === '' || !email.includes('@')) {
                alert('Por favor, digite um e-mail válido.');
                return;
            }

            if (senha === '' || senha.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres.');
                return;
            }

            alert('✅ Login realizado com sucesso! Bem-vindo(a)!');
            
            this.reset(); 
        });
    </script>

</body>
</html>
