<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../Iconcreme-Halloween-Cat.ico" type="image/x-icon" />
    <link rel="stylesheet" href="estilo.css" />
    <title>Cadastro | AdoteUmGatoMoc</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../Iconcreme-Halloween-Cat.ico" alt="ícone da página" width="85px" />
            <span><strong>AdoteUmGatoMoc</strong></span>
        </div>
        <nav>
            <a href="../newindex.html"><strong>Início</strong></a>
            <a href="../gatosdispnew.html">Gatos</a>
            <a href="../gatosdefnew.html">Especiais</a>
            <a href="../doacoes/paginicidoacao.html">Doações</a>
            <a href="minhaconta.html" class="destaque"> Minha conta </a>
        </nav>
    </header>

    <hr />

    
    <main class="cadastro-main">
        <section class="cadastro-container">
            <h2> Cadastre-se </h2>

            <form id="formCadastro" action="#" method="post" class="form-cadastro">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required />
                </div>

                
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required />
                </div>

                
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" />
                </div>


                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
        </section>
    </main>

    <hr />

    <footer>
        <p>🐾 AdoteUmGatoMoc – Montes Claros – MG</p>
        <p>❤️ Transforme uma vida, adote um gatinho!</p>
    </footer>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();

            if (nome === '') {
                alert('Por favor, digite seu nome.');
                return;
            }

            if (email === '' || !email.includes('@')) {
                alert('Por favor, digite um e-mail válido.');
                return;
            }

            if (telefone !== '' && telefone.length < 10) {
                alert('Telefone deve ter pelo menos 10 dígitos (com DDD).');
                return;
            }

            alert('✅ Cadastro realizado com sucesso! Bem-vindo(a), ' + nome + '!');
            this.reset(); 
        });
    </script>

</body>
</html>
